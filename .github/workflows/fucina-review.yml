name: Fucina Review

on:
  pull_request_target:
    types: [labeled]

concurrency:
  group: fucina-${{ github.repository }}
  cancel-in-progress: false

permissions:
      contents: read
      pull-requests: write
      issues: write

jobs:
  fucina:
    if: ${{ github.event.label.name == 'fucina:review' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Fucina
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
          AGENT_PAT: ${{ secrets.AGENT_PAT }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          FUCINA_ALLOWED_ACTORS: ${{ vars.FUCINA_ALLOWED_ACTORS }}
          FUCINA_AGENT: ${{ vars.FUCINA_AGENT }}
          FUCINA_MODEL: ${{ vars.FUCINA_MODEL }}
          FUCINA_AGENT_CLI_VERSION: ${{ vars.FUCINA_AGENT_CLI_VERSION }}
          FUCINA_MAX_ITERATIONS: 3
        run: |
          npm install -g @vekexasia/fucina@0.0.1
          fucina run
